<!doctype html><html><meta charset="utf-8"><title>Shoulder source proofs · baseline only</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block}#panel{position:fixed;left:4px;bottom:4px;z-index:110;background:#111e;color:#cff;font:12px monospace;padding:6px;max-width:590px;max-height:200px;overflow:auto}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}button{font:inherit}</style>
<canvas id="nvwa"></canvas><div id="panel"><button id="start" disabled>Start baseline proofs</button><button id="next" disabled>Next step</button><button id="check" disabled>Check screenshot</button><button id="cancel">Cancel sequence</button><pre id="status">Loading b1_79; no target authoring.</pre></div>
<script src="./transfer-core.js"></script><script src="./shoulder.js"></script><script type="module">
const el=id=>document.getElementById(id);let api,transfer,proofs;
const paceValue=new URLSearchParams(location.search).get('pace');if(paceValue!==null&&paceValue!=='45')throw Error('Only explicit pace=45 is supported');
function show(s){el('next').disabled=!s.next_enabled;el('check').disabled=!s.check_enabled;el('status').textContent=[s.phase,'request='+s.request_id,'mode='+s.mode,'token='+s.token,'countdown='+s.countdown,'currentness='+s.currentness,'final check='+s.final_check_index+' receipt='+s.last_final_receipt_index,...s.events.map(e=>e.ms.toFixed(1)+' '+e.name+(e.message?' '+e.message:''))].join('\n')}
try{api=await import('./pkg/b1_shoulder_source_corrective.js');await api.default();transfer=createTransfer(()=>api.b1_79_report(),()=>api.b1_79_frame());proofs=createShoulderProofs({pace:paceValue==='45'?45:undefined,fetch:(...a)=>fetch(...a),now:()=>performance.now(),interval:(f,n)=>setInterval(f,n),clearInterval:t=>clearInterval(t),timeout:(f,n)=>setTimeout(f,n),clearTimeout:t=>clearTimeout(t),pause:n=>new Promise(r=>setTimeout(r,n)),readWork:()=>api.b1_79_work(),readReport:()=>api.b1_79_report(),readFrame:()=>api.b1_79_frame(),send:v=>{transfer.invalidate();api.b1_79_command(JSON.stringify(v))},prepare:()=>transfer.prepare(),status:()=>transfer.status(),exactText:t=>transfer.exactText(t),invalidate:()=>transfer.invalidate(),render:show,warn:e=>console.warn('[SHOULDER-HELPER]',e)});el('start').disabled=false;el('start').onclick=()=>{el('start').disabled=true;void proofs.start().catch(e=>console.error('[SHOULDER-HELPER]',e))};el('next').onclick=()=>void proofs.next('button').catch(e=>console.warn('[SHOULDER-HELPER]',e));el('cancel').onclick=()=>proofs.cancel();el('check').onclick=()=>void proofs.checkScreenshot().catch(e=>console.warn('[SHOULDER-HELPER]',e));if(new URLSearchParams(location.search).get('case')==='proofs')el('start').onclick();}catch(e){el('status').textContent='FAILED '+String(e)}
</script></html>
