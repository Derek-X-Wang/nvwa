[package]
name = "humentity-probe"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
humentity = { path = "../derived" }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "reflect_auto_register", "bevy_asset", "bevy_scene", "bevy_world_serialization", "bevy_gltf", "bevy_animation", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_camera", "bevy_mesh", "bevy_image", "bevy_shader", "bevy_log", "bevy_color", "bevy_material", "morph", "morph_animation", "gltf_animation", "multi_threaded", "bevy_gizmos"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[patch.crates-io]
bevy_obj = { path = "../.deps/bevy_obj-0.19.0" }
wobj = { path = "../.deps/wobj-0.3.0" }
[profile.dev]
debug = 0
