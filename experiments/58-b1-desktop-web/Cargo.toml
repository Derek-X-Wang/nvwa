[package]
name = "b1-desktop-web"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
humentity = { path = "../57-b1-pose-runtime/derived" }
b1-pose-adapter = { path = "../57-b1-pose-runtime/adapter" }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "reflect_auto_register", "bevy_asset", "bevy_scene", "bevy_world_serialization", "bevy_gltf", "bevy_animation", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_camera", "bevy_mesh", "bevy_image", "bevy_shader", "bevy_window", "bevy_winit", "bevy_log", "bevy_color", "bevy_material", "png", "webgpu", "morph", "morph_animation", "gltf_animation", "multi_threaded", "keyboard", "mouse", "touch", "bevy_gizmos"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Feature-only edge for the already pinned cached browser entropy crate.
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Location", "Document", "HtmlElement"] }
[patch.crates-io]
bevy_obj = { path = "../57-b1-pose-runtime/.deps/bevy_obj-0.19.0" }
wobj = { path = "../57-b1-pose-runtime/.deps/wobj-0.3.0" }
[profile.dev]
debug = 0
opt-level = 1
