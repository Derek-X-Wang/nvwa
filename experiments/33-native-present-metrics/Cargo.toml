[package]
name = "nvwa-native-present-metrics"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]
resolver = "3"

[dependencies]
nvwa-studio = { path = "../../crates/nvwa-studio" }
nvwa-runtime = { path = "../../crates/nvwa-runtime" }
bevy = { version = "=0.19.1", default-features = false }
serde_json = "1.0"
libc = "0.2"

[patch.crates-io]
wgpu-hal = { path = "../../.work/m11-perf/native/vendor/wgpu-hal-29.0.4" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
