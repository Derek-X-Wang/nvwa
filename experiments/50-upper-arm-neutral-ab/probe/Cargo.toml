[package]
name = "nvwa-runtime-pose-probe"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nvwa-runtime-pose-probe"
path = "src/main.rs"

[dependencies]
nvwa-studio = { path = "../../../crates/nvwa-studio", features = ["manual-start"] }
nvwa-runtime = { path = "../../../crates/nvwa-runtime" }
bevy = { version = "=0.19.1", default-features = false }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "HtmlElement", "console"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 1

# Isolated probe workspaces do not inherit the product workspace patches.
[patch.crates-io]
bevy_obj = { path = "../../../vendor/bevy_obj" }
wobj = { path = "../../../vendor/wobj" }
