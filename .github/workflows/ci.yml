          # require real source/upload data, not an invented portable fixture.
          python3 -B experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-motion-matrix/keyframes/t+1__b1_arm_rehearsal_v1__k16.json.gz"
          python3 -B -O experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-motion-matrix/keyframes/t+1__b1_arm_rehearsal_v1__k16.json.gz"
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
      # native-cache-trial begin
      - name: Verify warm sources, all gates and target cap
        run: python3 -B experiments/83-native-cache-trial/cache_trial.py finish --lane warm
      # native-cache-trial end
  # native-cache-trial end

  mac-smoke:
    name: Mac native compile and real CLI smoke
    needs: classify
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Compile native Studio and build ordinary CLI
        run: |
          cargo check -p nvwa-studio --locked
          cargo build -p nvwa-cli --locked
      - name: Actual Mac CLI Work and asset smoke
        run: python3 -B scripts/ci-tiering/mac_smoke.py --binary "$CARGO_TARGET_DIR/debug/nvwa-cli" --assets "$GITHUB_WORKSPACE/assets"
  linux-shared:
    name: Linux shared runtime and full motion evidence
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      matrix_sha256: ${{ steps.motion-probe.outputs.matrix_sha256 }}
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch all exact shared graphs
        run: bash scripts/ci-tiering/linux-shared.sh fetch
      - name: Shared workspace tests and real CPU export
        run: bash scripts/ci-tiering/linux-shared.sh workspace
      - name: Shared appearance acceptance bridges
        run: bash scripts/ci-tiering/linux-shared.sh bridges
      - name: Shared production mutation red and restored green
        timeout-minutes: 12
        run: python3 -B scripts/ci-tiering/linux_mutations.py --linux-backend --disposable-checkout --out "$RUNNER_TEMP/nvwa-b1-motion-mutations"
      - name: Compile exact Linux motion probe for matrix job
        id: motion-probe
        run: |
          set -euo pipefail
          bash scripts/ci-tiering/linux-shared.sh matrix-build
          digest=$(sha256sum "$CARGO_TARGET_DIR/debug/matrix" | cut -d' ' -f1)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo 'invalid matrix digest' >&2; exit 1; }
          echo "matrix_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Transfer exact Linux motion probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvwa-linux-matrix-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/debug/matrix
          if-no-files-found: error
          retention-days: 1
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
  linux-matrix:
    name: Linux full motion matrix and real garment controls
    needs: [classify, linux-shared]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download exact Linux motion probe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nvwa-linux-matrix-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/debug
      - name: Complete 594-frame matrix and real garment controls
        timeout-minutes: 20
        env:
          EXPECTED_MATRIX_SHA256: ${{ needs.linux-shared.outputs.matrix_sha256 }}
        run: bash scripts/ci-tiering/linux-matrix-run.sh
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
  linux-check:
    name: Linux shared workspace check
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch all exact shared graphs
        run: bash scripts/ci-tiering/linux-shared.sh fetch
      - name: Check shared workspace graph
        run: bash scripts/ci-tiering/linux-shared.sh check
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
  required-gate:
    name: Required CI gate
    if: ${{ always() }}
    needs: [classify, portable, portable-eye, linux-shared, linux-matrix, linux-check, mac-smoke, b1-source-regression, mac-workspace-required, mac-bridges-required, mac-mutation-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every applicable result, reject missing/cancelled/skipped
        env:
          TIER_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci-tiering/policy.py gate
  full-mac-report:
    name: Complete Mac result report
    if: ${{ always() }}
    needs: [classify, mac-workspace-required, mac-bridges-required, mac-workspace-background, mac-bridges-background, mac-mutation-required, mac-mutation-background]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish actual full-Mac result (failure remains red)
        env:
          TIER_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci-tiering/policy.py report
