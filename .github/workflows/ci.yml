name: Bounded CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# No cache restore/save steps; no cache token overrides.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Smaller cold builds on standard runners; local cached validation used defaults.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  portable:
    name: Core, CLI, and diagnostic controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official ref verified 2026-10-12
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check portable source and real CLI paths
        run: bash experiments/27-ci-baseline/check.sh portable
      - name: Check complete standalone CLI distribution
        run: |
          cargo build -p nvwa-cli --locked --offline
          python3 -B scripts/test-cli-package.py --binary target/debug/nvwa-cli
          python3 -B -O scripts/test-cli-package.py --binary target/debug/nvwa-cli
      - name: Verify admitted production character inputs and source
        run: |
          python3 -B scripts/verify-b1-inputs.py
          python3 -B -O scripts/verify-b1-inputs.py
          python3 -B scripts/test-b1-inputs.py
          python3 -B -O scripts/test-b1-inputs.py
      - name: Check independent B1 motion comparator controls
        run: |
          python3 -B experiments/60-b1-continuous-motion/test_controls.py
          python3 -B -O experiments/60-b1-continuous-motion/test_controls.py
          python3 -B experiments/60-b1-continuous-motion/test_serve.py
          python3 -B -O experiments/60-b1-continuous-motion/test_serve.py
      - name: Check bounded diagnostic controls
        run: bash experiments/27-ci-baseline/check.sh diagnostics
      - name: Check bounded appearance diagnostic controls
        run: |
          python3 -B -m unittest discover -s experiments/65-b1-appearance-quality -p 'test_*.py' -v
          python3 -B -O -m unittest discover -s experiments/65-b1-appearance-quality -p 'test_*.py' -v
          python3 -B -m unittest discover -s experiments/65-b1-appearance-quality/preview/build -p 'test_*.py' -v
          python3 -B -O -m unittest discover -s experiments/65-b1-appearance-quality/preview/build -p 'test_*.py' -v
      - name: Check eye, hair, and character parameter controls
        timeout-minutes: 3
        run: |
          # The transfer tests run the actual experimental HTML handlers in
          # Node. A missing interpreter is an error, never a skipped green test.
          node --version
          for experiment in 67-b1-eye-surface-diagnosis 68-b1-eye-render-diagnosis 69-b1-hairline 71-b1-character-parameters 72-b1-admission-controls 73-high-poly-eyes 79-shoulder-pose-corrective 79-shoulder-pose-corrective/browser 80-hairline-export-diagnosis 82-hairline-aba; do
            python3 -B -m unittest discover -s "experiments/$experiment" -p 'test_*.py' -v
            python3 -B -O -m unittest discover -s "experiments/$experiment" -p 'test_*.py' -v
          done
      - name: Check authenticated B1 source bundle and rejection controls
        timeout-minutes: 3
        run: |
          python3 -B -m unittest discover -s experiments/59-b1-ci-inputs -p 'test_*.py' -v
          python3 -B -O -m unittest discover -s experiments/59-b1-ci-inputs -p 'test_*.py' -v
          python3 -B -m unittest discover -s experiments/57-b1-pose-runtime -p 'test_prepare_ci.py' -v
          python3 -B -O -m unittest discover -s experiments/57-b1-pose-runtime -p 'test_prepare_ci.py' -v
          python3 -B experiments/59-b1-ci-inputs/prepare_ci_inputs.py --out "$RUNNER_TEMP/nvwa-b1-portable-seed"
          python3 -B experiments/57-b1-pose-runtime/prepare.py --ci-inputs "$RUNNER_TEMP/nvwa-b1-portable-seed"
          python3 -B experiments/58-b1-desktop-web/prepare.py --ci-inputs "$RUNNER_TEMP/nvwa-b1-portable-seed"
          python3 -B -m unittest discover -s experiments/58-b1-desktop-web -p 'test_*.py' -v
          python3 -B -O -m unittest discover -s experiments/58-b1-desktop-web -p 'test_*.py' -v
      - name: Prepare locked importer dependencies and check offline motion controls
        timeout-minutes: 6
        run: |
          cargo fetch --locked --manifest-path experiments/42-motion-import/Cargo.toml
          python3 -B experiments/42-motion-import/check_model_free.py
          python3 -B experiments/44-approved-cpu-motion-trial/verify_evidence.py
          python3 -B experiments/45-genuine-rig-admission/probe.py
          python3 -B experiments/45-genuine-rig-admission/test_controls.py
          python3 -B experiments/46-soma-reference-calibration/calibrate.py
          python3 -B experiments/46-soma-reference-calibration/test_controls.py
          python3 -B -O experiments/46-soma-reference-calibration/test_controls.py
          python3 -B experiments/46-soma-reference-calibration/independent/oracle.py
          python3 -B experiments/46-soma-reference-calibration/independent/test_controls.py
          python3 -B -O experiments/46-soma-reference-calibration/independent/test_controls.py
          python3 -B experiments/47-fixture-rig-calibration/calibrate.py
          python3 -B experiments/47-fixture-rig-calibration/test_controls.py
          python3 -B -O experiments/47-fixture-rig-calibration/test_controls.py
          python3 -B experiments/47-fixture-rig-calibration/reference/audit.py
          python3 -B -O experiments/47-fixture-rig-calibration/reference/audit.py
          python3 -B experiments/47-fixture-rig-calibration/reference/test_audit.py
          python3 -B experiments/48-genuine-fixture-work/export.py verify experiments/48-genuine-fixture-work/artifacts
          python3 -B experiments/48-genuine-fixture-work/test_controls.py
          python3 -B -O experiments/48-genuine-fixture-work/test_controls.py
          python3 -B experiments/48-genuine-fixture-work/independent/check_serialized.py
          python3 -B -O experiments/48-genuine-fixture-work/independent/check_serialized.py
          python3 -B experiments/48-genuine-fixture-work/independent/test_serialized.py
          python3 -B -O experiments/48-genuine-fixture-work/independent/test_serialized.py
          # Preserve every original49 CPU family and rejection control in its
          # authenticated historical context after current product source advances.
          # These retained captures are not fresh rehearsal-runtime evidence.
          python3 -B experiments/51-rehearsal-history-compat/audit.py
          python3 -B -O experiments/51-rehearsal-history-compat/audit.py
          python3 -B experiments/51-rehearsal-history-compat/test_controls.py
          python3 -B -O experiments/51-rehearsal-history-compat/test_controls.py
      - name: Check frozen upper-arm comparison and retained runtime captures
        timeout-minutes: 5
        run: |
          python3 -B experiments/50-upper-arm-neutral-ab/test_candidate.py
          python3 -B -O experiments/50-upper-arm-neutral-ab/test_candidate.py
          python3 -B experiments/50-upper-arm-neutral-ab/test_runtime_adapter.py
          python3 -B -O experiments/50-upper-arm-neutral-ab/test_runtime_adapter.py
          python3 -B experiments/50-upper-arm-neutral-ab/test_runtime_measure.py
          python3 -B -O experiments/50-upper-arm-neutral-ab/test_runtime_measure.py
          python3 -B experiments/50-upper-arm-neutral-ab/runtime_evidence.py
          mkdir -p .work/ci-neutral50
          for platform in native web; do
            for variant in baseline candidate; do
              python3 -B experiments/50-upper-arm-neutral-ab/probe/compare.py "experiments/50-upper-arm-neutral-ab/results/$platform-$variant.json" --variant "$variant" --output ".work/ci-neutral50/$platform-$variant.json"
            done
          done
  native-and-wasm:
    name: macOS CPU tests and Wasm compile check
    # Reject cheap portable failures before spending a cold graphical compile.
    needs: portable
    runs-on: macos-14
    # The measured original lane already takes about 30 minutes cold. Keep a
    # finite bound for native tests, mutation witnesses and continuous motion.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      # Reuse this run's root outputs for the isolated probe; no remote cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Run workspace CPU tests
        run: |
          bash experiments/27-ci-baseline/check.sh native
          # Product packages are formatted in portable. --all here also visits
          # admitted vendor path dependencies whose exact bytes must be retained.
          cargo fmt --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo fmt --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo check --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --lib --locked --offline
          cargo check --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --lib --locked --offline
      - name: Check appearance quality and production acceptance bridges
        run: |
          cargo fmt --manifest-path experiments/65-b1-appearance-quality/preview/Cargo.toml --package b1-appearance-quality-preview --check
          cargo fmt --manifest-path experiments/66-b1-appearance-work/Cargo.toml --package b1-appearance-work --check
          cargo test --manifest-path experiments/65-b1-appearance-quality/preview/Cargo.toml --lib --locked --offline
          cargo test --manifest-path experiments/66-b1-appearance-work/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/68-b1-eye-render-diagnosis/Cargo.toml --package b1-eye-render-diagnosis --check
          cargo fmt --manifest-path experiments/71-b1-character-parameters/Cargo.toml --package b1-character-parameters --check
          cargo test --manifest-path experiments/68-b1-eye-render-diagnosis/Cargo.toml --lib --locked --offline
          cargo test --manifest-path experiments/71-b1-character-parameters/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/73-high-poly-eyes/Cargo.toml --package b1-high-poly-eyes --check
          cargo test --manifest-path experiments/73-high-poly-eyes/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/79-shoulder-pose-corrective/Cargo.toml --package b1-shoulder-source-corrective --check
          cargo test --manifest-path experiments/79-shoulder-pose-corrective/Cargo.toml --lib --locked --offline
      - name: Check B1 production-source mutation witnesses
        timeout-minutes: 12
        run: python3 -B scripts/check-b1-motion-mutations.py --disposable-checkout --out "$RUNNER_TEMP/nvwa-b1-motion-mutations"
      - name: Execute the actual B1 continuous motion matrix
        # Independent full-weight Python checks stream594frames; retain a finite
        #20minute step within the existing60minute job, including probe linking.
        timeout-minutes: 20
        run: |
          cargo fmt --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --package b1-continuous-probe --check
          cargo build --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --bins --locked --offline
          python3 -B experiments/60-b1-continuous-motion/run_matrix.py --binary "$CARGO_TARGET_DIR/debug/matrix" --asset-root "$GITHUB_WORKSPACE/assets" --out "$RUNNER_TEMP/nvwa-b1-motion-matrix"
          # Use this job's actual retained source2 frame. The garment controls
          # require real source/upload data, not an invented portable fixture.
          python3 -B experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-motion-matrix/keyframes/t+1__b1_arm_rehearsal_v1__k16.json.gz"
          python3 -B -O experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-motion-matrix/keyframes/t+1__b1_arm_rehearsal_v1__k16.json.gz"
  b1-source-regression:
    name: macOS B1 source regression and viewer checks
    # Keep the independent cold B1 build and Web checks inside a finite budget.
    needs: portable
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      # This target directory belongs to this job's fresh runner only.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Prepare pinned B1 inputs without asset or tool downloads
        run: |
          mkdir -p .work
          python3 -B experiments/59-b1-ci-inputs/prepare_ci_inputs.py --out "$RUNNER_TEMP/nvwa-b1-seed"
          python3 -B experiments/57-b1-pose-runtime/prepare.py --ci-inputs "$RUNNER_TEMP/nvwa-b1-seed"
          python3 -B experiments/58-b1-desktop-web/prepare.py --ci-inputs "$RUNNER_TEMP/nvwa-b1-seed"
          cargo fetch --locked --manifest-path experiments/57-b1-pose-runtime/adapter/Cargo.toml
          cargo fetch --locked --manifest-path experiments/58-b1-desktop-web/Cargo.toml
      - name: Execute real B1 source and sampled pose regression
        env:
          B1_CI_INPUTS: ${{ runner.temp }}/nvwa-b1-seed
          # Match the existing optimized Bevy dependency build in this job.
          CARGO_PROFILE_DEV_OPT_LEVEL: '1'
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        run: |
          cargo fmt --manifest-path experiments/57-b1-pose-runtime/adapter/Cargo.toml --package b1-pose-adapter --check
          cargo fmt --manifest-path experiments/58-b1-desktop-web/Cargo.toml --package b1-desktop-web --check
          # Run the original adapter integration test through the viewer graph;
          # this shares its real Bevy features instead of compiling a third stack.
          cargo test --manifest-path experiments/58-b1-desktop-web/Cargo.toml --package b1-pose-adapter --test sampled --locked --offline -- --nocapture
          cargo test --manifest-path experiments/58-b1-desktop-web/Cargo.toml --lib --locked --offline
          cargo build --manifest-path experiments/58-b1-desktop-web/Cargo.toml --bin b1-desktop-web --locked --offline
          python3 -B -O experiments/58-b1-desktop-web/verify_native.py --binary "$CARGO_TARGET_DIR/debug/b1-desktop-web" --asset-root "$GITHUB_WORKSPACE/.work/b1-pose-viewer/site/assets" --out "$RUNNER_TEMP/nvwa-b1-viewer-runtime"
      - name: Check the same B1 viewer for native and Web
        run: |
          cargo check --manifest-path experiments/58-b1-desktop-web/Cargo.toml --locked --offline
          cargo check --manifest-path experiments/58-b1-desktop-web/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
      - name: Compile the actual Web target
        run: |
          bash experiments/27-ci-baseline/check.sh wasm
          cargo check --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
          cargo check --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
          cargo check --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
          cargo check --manifest-path experiments/65-b1-appearance-quality/preview/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
          cargo check --manifest-path experiments/66-b1-appearance-work/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
          cargo check --manifest-path experiments/68-b1-eye-render-diagnosis/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
          cargo check --manifest-path experiments/71-b1-character-parameters/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
          cargo check --manifest-path experiments/79-shoulder-pose-corrective/Cargo.toml --lib --target wasm32-unknown-unknown --locked --offline
