name: Bounded CI
on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
# Existing complete-Mac main-only cache policy is retained; PRs stay cold.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # PR checkout can be a synthetic merge; keep the event head separately.
  NVWA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Smaller cold builds on standard runners; local cached validation used defaults.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
defaults:
  run:
    # Original run bodies execute through Bash -e; scoped observers add no Cargo flags.
    shell: python3 -B scripts/ci-timing.py shell {0}
jobs:
  classify:
    name: Classify required CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_required: ${{ steps.scope.outputs.full_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tier policy controls
        run: |
          python3 -B scripts/ci-tiering/test_policy.py
          python3 -B -O scripts/ci-tiering/test_policy.py
          python3 -B scripts/ci-tiering/test_portable_split.py
          python3 -B -O scripts/ci-tiering/test_portable_split.py
      - id: scope
        name: Classify complete base/head diff (unknown requires full Mac)
        run: python3 -B scripts/ci-tiering/policy.py classify
  portable-eye:
    name: Eye, hair, and character parameter controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official ref verified 2026-10-12
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check eye, hair, and character parameter controls
        timeout-minutes: 20
        run: python3 -B scripts/check-portable.py eye-hair-parameters
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
  portable:
    name: Core, CLI, and diagnostic controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official ref verified 2026-10-12
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check shared portable runner controls
        run: python3 -B scripts/check-portable.py runner-contract
      - name: Check CI timing controls
        run: python3 -B scripts/check-portable.py ci-timing-contract
      - name: Check portable source and real CLI paths
        run: python3 -B scripts/check-portable.py source-cli
      - name: Check complete standalone CLI distribution
        run: python3 -B scripts/check-portable.py cli-distribution
      - name: Verify admitted production character inputs and source
        run: python3 -B scripts/check-portable.py b1-inputs
      - name: Check independent B1 motion comparator controls
        run: python3 -B scripts/check-portable.py motion-comparator
      - name: Check bounded diagnostic controls
        run: python3 -B scripts/check-portable.py diagnostics
      - name: Check bounded appearance diagnostic controls
        run: python3 -B scripts/check-portable.py appearance
      - name: Check authenticated B1 source bundle and rejection controls
        timeout-minutes: 3
        run: python3 -B scripts/check-portable.py authenticated-source
      - name: Prepare locked importer dependencies and check offline motion controls
        timeout-minutes: 6
        run: python3 -B scripts/check-portable.py offline-motion
      # native-cache-trial begin
      - name: Check bounded native cache trial controls
        run: python3 -B scripts/check-portable.py native-cache-contract
      # native-cache-trial end
      # native-main-cache begin
      - name: Check main-only native cache policy
        run: python3 -B scripts/check-portable.py native-main-cache-contract
      # native-main-cache end
      - name: Check isolated shoulder rest-refit controls
        run: python3 -B scripts/check-portable.py shoulder-rest-refit
      - name: Check current nineteen-case shoulder controls
        run: python3 -B scripts/check-portable.py current19-shoulder-refit
      - name: Check frozen upper-arm comparison and retained runtime captures
        timeout-minutes: 5
        run: python3 -B scripts/check-portable.py frozen-upper-arm
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
  native-and-wasm:
    name: macOS CPU tests and Wasm compile check
    # Reject cheap portable failures before spending a cold graphical compile.
    needs: [classify, portable, portable-eye]
    if: ${{ false }} # retired complete lane; split jobs own every check
    runs-on: macos-15
    # The measured original lane already takes about 30 minutes cold. Keep a
    # finite bound for native tests, mutation witnesses and continuous motion.
    timeout-minutes: 75
    # native-cache-trial begin
    outputs:
      trial_enabled: ${{ steps.trial-prepare.outputs.enabled }}
      trial_key: ${{ steps.trial-prepare.outputs.key }}
    # native-cache-trial end
    env:
      CARGO_BUILD_JOBS: '1'
      # Reuse this run's root outputs for the isolated probe; no remote cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # native-cache-trial begin
      TRIAL_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      TRIAL_HEAD_REF: ${{ github.head_ref }}
      # native-cache-trial end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      # native-main-cache begin
      - name: Prepare main-only native seed
        id: main-prepare
        run: python3 -B experiments/83-native-cache-trial/main_policy/policy.py prepare
      - name: Restore exact main native seed
        if: ${{ steps.main-prepare.outputs.enabled == 'true' && steps.main-prepare.outputs.restore == 'true' }}
        id: main-restore
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/target
          key: ${{ steps.main-prepare.outputs.key }}
      - name: Verify main restore or safely prepare complete cold fallback
        if: ${{ steps.main-prepare.outputs.enabled == 'true' }}
        env:
          MAIN_RESTORE_OUTCOME: ${{ steps.main-restore.outcome }}
          MAIN_RESTORE_HIT: ${{ steps.main-restore.outputs.cache-hit }}
          MAIN_RESTORE_PRIMARY: ${{ steps.main-restore.outputs.cache-primary-key }}
          MAIN_RESTORE_MATCHED: ${{ steps.main-restore.outputs.cache-matched-key }}
        run: python3 -B experiments/83-native-cache-trial/main_policy/policy.py restore
      # native-main-cache end
      # native-cache-trial begin
      - name: Prepare bounded native cache trial
        id: trial-prepare
        run: python3 -B experiments/83-native-cache-trial/cache_trial.py prepare --lane cold
      - name: Measure cold exact-key miss
        if: ${{ steps.trial-prepare.outputs.enabled == 'true' }}
        timeout-minutes: 4
        run: python3 -B experiments/83-native-cache-trial/cache_trial.py cold-miss --lane cold
      # native-cache-trial end
      - name: Run workspace CPU tests
        run: |
          bash experiments/27-ci-baseline/check.sh native
          # Product packages are formatted in portable. --all here also visits
          # admitted vendor path dependencies whose exact bytes must be retained.
          cargo fmt --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo fmt --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo check --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --lib --locked --offline
          cargo check --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --lib --locked --offline
      - name: Check appearance quality and production acceptance bridges
        run: |
          cargo fmt --manifest-path experiments/65-b1-appearance-quality/preview/Cargo.toml --package b1-appearance-quality-preview --check
          cargo fmt --manifest-path experiments/66-b1-appearance-work/Cargo.toml --package b1-appearance-work --check
          cargo test --manifest-path experiments/65-b1-appearance-quality/preview/Cargo.toml --lib --locked --offline
          cargo test --manifest-path experiments/66-b1-appearance-work/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/68-b1-eye-render-diagnosis/Cargo.toml --package b1-eye-render-diagnosis --check
          cargo fmt --manifest-path experiments/71-b1-character-parameters/Cargo.toml --package b1-character-parameters --check
          cargo test --manifest-path experiments/68-b1-eye-render-diagnosis/Cargo.toml --lib --locked --offline
          cargo test --manifest-path experiments/71-b1-character-parameters/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/73-high-poly-eyes/Cargo.toml --package b1-high-poly-eyes --check
          cargo test --manifest-path experiments/73-high-poly-eyes/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/79-shoulder-pose-corrective/Cargo.toml --package b1-shoulder-source-corrective --check
          cargo test --manifest-path experiments/79-shoulder-pose-corrective/Cargo.toml --lib --locked --offline
      - name: Check B1 production-source mutation witnesses
        timeout-minutes: 12
        run: python3 -B scripts/check-b1-motion-mutations.py --disposable-checkout --out "$RUNNER_TEMP/nvwa-b1-motion-mutations"
      - name: Execute the actual B1 continuous motion matrix
        # Independent full-weight Python checks stream594frames; retain a finite
        #20minute step within the existing75minute job, including probe linking.
        timeout-minutes: 20
        run: |
          cargo fmt --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --package b1-continuous-probe --check
          cargo build --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --bins --locked --offline
          python3 -B experiments/60-b1-continuous-motion/run_matrix.py --binary "$CARGO_TARGET_DIR/debug/matrix" --asset-root "$GITHUB_WORKSPACE/assets" --out "$RUNNER_TEMP/nvwa-b1-motion-matrix"
          # Use this job's actual retained source2 frame. The garment controls
          # require real source/upload data, not an invented portable fixture.
          python3 -B experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-motion-matrix/keyframes/t+1__b1_arm_rehearsal_v1__k16.json.gz"
          python3 -B -O experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-motion-matrix/keyframes/t+1__b1_arm_rehearsal_v1__k16.json.gz"
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
      # native-cache-trial begin
      - name: Verify restored sources, all gates and target cap
        if: ${{ steps.trial-prepare.outputs.enabled == 'true' }}
        run: python3 -B experiments/83-native-cache-trial/cache_trial.py finish --lane cold
      - name: Measure native target compression and save
        if: ${{ steps.trial-prepare.outputs.enabled == 'true' }}
        timeout-minutes: 4
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/target
          key: ${{ steps.trial-prepare.outputs.key }}
      - name: Verify remote exact-key persistence after save
        if: ${{ steps.trial-prepare.outputs.enabled == 'true' }}
        id: trial-persisted
        timeout-minutes: 4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/target
          key: ${{ steps.trial-prepare.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Assert real persisted exact hit
        if: ${{ steps.trial-prepare.outputs.enabled == 'true' }}
        env:
          TRIAL_HIT: ${{ steps.trial-persisted.outputs.cache-hit }}
          TRIAL_PRIMARY: ${{ steps.trial-persisted.outputs.cache-primary-key }}
          TRIAL_MATCHED: ${{ steps.trial-persisted.outputs.cache-matched-key }}
        run: python3 -B experiments/83-native-cache-trial/cache_trial.py receipt --lane persisted
      # native-cache-trial end
      # native-main-cache begin
      - name: Verify main seed gates and complete logical size
        if: ${{ steps.main-prepare.outputs.enabled == 'true' }}
        id: main-finish
        run: python3 -B experiments/83-native-cache-trial/main_policy/policy.py finish
      - name: Save only independently absent main seed
        if: ${{ steps.main-finish.outputs.save == 'true' }}
        id: main-save
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/target
          key: ${{ steps.main-prepare.outputs.key }}
      - name: Look up exact main seed persistence
        if: ${{ steps.main-finish.outputs.save == 'true' }}
        id: main-persist
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/target
          key: ${{ steps.main-prepare.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Record verified persistence or explicit cache service failure
        if: ${{ steps.main-finish.outputs.save == 'true' }}
        env:
          MAIN_SAVE_OUTCOME: ${{ steps.main-save.outcome }}
          MAIN_PERSIST_OUTCOME: ${{ steps.main-persist.outcome }}
          MAIN_PERSIST_HIT: ${{ steps.main-persist.outputs.cache-hit }}
          MAIN_PERSIST_PRIMARY: ${{ steps.main-persist.outputs.cache-primary-key }}
          MAIN_PERSIST_MATCHED: ${{ steps.main-persist.outputs.cache-matched-key }}
        run: python3 -B experiments/83-native-cache-trial/main_policy/policy.py persist
      # native-main-cache end
  mac-workspace-required:
    name: Complete Mac Workspace and CPU required
    needs: [classify, portable, portable-eye]
    if: ${{ needs.classify.outputs.full_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Run workspace CPU tests
        run: |
          bash experiments/27-ci-baseline/check.sh native
          # Product packages are formatted in portable. --all here also visits
          # admitted vendor path dependencies whose exact bytes must be retained.
          cargo fmt --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo fmt --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo check --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --lib --locked --offline
          cargo check --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --lib --locked --offline
      - name: Fetch locked one-frame Mac witness graph
        run: cargo fetch --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --locked
      - name: Check actual Mac garment numerical witness
        timeout-minutes: 20
        run: |
          cargo fmt --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --package b1-continuous-probe --check
          cargo build --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --bin matrix --locked --offline
          python3 -B scripts/ci-tiering/mac_garment_witness.py --binary "$CARGO_TARGET_DIR/debug/matrix" --asset-root "$GITHUB_WORKSPACE/assets" --frame "$RUNNER_TEMP/nvwa-b1-garment-witness.json.gz"
          python3 -B experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-garment-witness.json.gz"
          python3 -B -O experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-garment-witness.json.gz"
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
      # native-cache-trial begin
  mac-appearance-required:
    name: Complete Mac Appearance bridges required
    needs: [classify, portable, portable-eye]
    if: ${{ needs.classify.outputs.full_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked Mac graph dependencies
        run: |
          cargo fetch --locked
          for manifest in experiments/65-b1-appearance-quality/preview/Cargo.toml experiments/66-b1-appearance-work/Cargo.toml experiments/68-b1-eye-render-diagnosis/Cargo.toml experiments/71-b1-character-parameters/Cargo.toml experiments/73-high-poly-eyes/Cargo.toml experiments/79-shoulder-pose-corrective/Cargo.toml; do
            cargo fetch --manifest-path "$manifest" --locked
          done
      - name: Check appearance quality and production acceptance bridges
        run: |
          cargo fmt --manifest-path experiments/65-b1-appearance-quality/preview/Cargo.toml --package b1-appearance-quality-preview --check
          cargo fmt --manifest-path experiments/66-b1-appearance-work/Cargo.toml --package b1-appearance-work --check
          cargo test --manifest-path experiments/65-b1-appearance-quality/preview/Cargo.toml --lib --locked --offline
          cargo test --manifest-path experiments/66-b1-appearance-work/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/68-b1-eye-render-diagnosis/Cargo.toml --package b1-eye-render-diagnosis --check
          cargo fmt --manifest-path experiments/71-b1-character-parameters/Cargo.toml --package b1-character-parameters --check
          cargo test --manifest-path experiments/68-b1-eye-render-diagnosis/Cargo.toml --lib --locked --offline
          cargo test --manifest-path experiments/71-b1-character-parameters/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/73-high-poly-eyes/Cargo.toml --package b1-high-poly-eyes --check
          cargo test --manifest-path experiments/73-high-poly-eyes/Cargo.toml --lib --locked --offline
          cargo fmt --manifest-path experiments/79-shoulder-pose-corrective/Cargo.toml --package b1-shoulder-source-corrective --check
          cargo test --manifest-path experiments/79-shoulder-pose-corrective/Cargo.toml --lib --locked --offline
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
      # native-cache-trial begin
  mac-mutation-required:
    name: Complete Mac production mutation required
    needs: [classify, portable, portable-eye]
    if: ${{ needs.classify.outputs.full_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm native Mac host
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked production mutation graph
        run: cargo fetch --locked
      - name: Precompile exact production mutation graph
        run: cargo test --workspace --lib --locked --offline --no-run
      - name: Check B1 production-source mutation witnesses
        timeout-minutes: 12
        run: python3 -B scripts/check-b1-motion-mutations.py --disposable-checkout --out "$RUNNER_TEMP/nvwa-b1-motion-mutations"
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
  mac-bridges-required:
    name: Complete Mac Appearance and mutation required
    needs: [classify, mac-appearance-required, mac-mutation-required]
    if: ${{ always() && needs.classify.outputs.full_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require appearance and mutation evidence
        env:
          APPEARANCE_RESULT: ${{ needs.mac-appearance-required.result }}
          MUTATION_RESULT: ${{ needs.mac-mutation-required.result }}
        run: |
          printf "appearance=%s mutation=%s\n" "$APPEARANCE_RESULT" "$MUTATION_RESULT"
          test "$APPEARANCE_RESULT" = success
          test "$MUTATION_RESULT" = success
  mac-workspace-background:
    name: Complete Mac Workspace and CPU background
    needs: [classify, portable, portable-eye]
    if: ${{ needs.classify.outputs.full_required == 'false' }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Run workspace CPU tests
        run: |
          bash experiments/27-ci-baseline/check.sh native
          # Product packages are formatted in portable. --all here also visits
          # admitted vendor path dependencies whose exact bytes must be retained.
          cargo fmt --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo fmt --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --package nvwa-runtime-pose-probe --check
          cargo check --manifest-path experiments/49-runtime-pose-parity/probe/Cargo.toml --lib --locked --offline
          cargo check --manifest-path experiments/50-upper-arm-neutral-ab/probe/Cargo.toml --lib --locked --offline
      - name: Fetch locked one-frame Mac witness graph
        run: cargo fetch --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --locked
      - name: Check actual Mac garment numerical witness
        timeout-minutes: 20
        run: |
          cargo fmt --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --package b1-continuous-probe --check
          cargo build --manifest-path experiments/60-b1-continuous-motion/Cargo.toml --bin matrix --locked --offline
          python3 -B scripts/ci-tiering/mac_garment_witness.py --binary "$CARGO_TARGET_DIR/debug/matrix" --asset-root "$GITHUB_WORKSPACE/assets" --frame "$RUNNER_TEMP/nvwa-b1-garment-witness.json.gz"
          python3 -B experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-garment-witness.json.gz"
          python3 -B -O experiments/70-b1-garment-defect/test_controls.py --asset-root assets/characters/mpfb-b1-v1 --frame "$RUNNER_TEMP/nvwa-b1-garment-witness.json.gz"
      - name: Report existing command timing
        if: ${{ always() }}
        shell: bash
        run: python3 -B scripts/ci-timing.py report
      # native-cache-trial begin
  mac-appearance-background:
    name: Complete Mac Appearance bridges background
    needs: [classify, portable, portable-eye]
    if: ${{ needs.classify.outputs.full_required == 'false' }}
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '1'
