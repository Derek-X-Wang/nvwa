[package]
name = "nvwa-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675" }
bevy.workspace = true
bevy_egui.workspace = true
nvwa-core.workspace = true
nvwa-runtime.workspace = true
serde_json.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "Window", "Location", "Document", "HtmlInputElement", "HtmlElement",
    "HtmlAnchorElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url",
    "Event", "EventTarget", "Node", "console", "UrlSearchParams", "RequestInit",
    "HtmlTextAreaElement", "CompositionEvent", "InputEvent", "KeyboardEvent",
    "ClipboardEvent", "DataTransfer", "Navigator", "CssStyleDeclaration", "DomRect",
    "RequestMode", "RequestRedirect", "RequestCredentials", "Response", "Headers",
    "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult",
    "AbortController", "AbortSignal",
] }
