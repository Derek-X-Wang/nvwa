[package]
name = "nvwa-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
motion-query = ["dep:bevy", "dep:nvwa-runtime"]
default = []
cpu-render = ["dep:nvwa-runtime", "nvwa-runtime/cpu-render", "dep:png", "dep:sha2"]

[dependencies]
bevy = { workspace = true, optional = true }
nvwa-core.workspace = true
nvwa-runtime = { workspace = true, optional = true }
serde_json.workspace = true
png = { version = "=0.18.1", optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
