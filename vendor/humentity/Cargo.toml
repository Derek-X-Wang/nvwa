[package]
autobins = false
autoexamples = false
autotests = false
autobenches = false
name = "humentity"
version = "0.19.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emberlightstudios/Humentity"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "reflect_auto_register", "bevy_asset", "bevy_scene", "bevy_world_serialization", "bevy_gltf", "bevy_animation", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_camera", "bevy_mesh", "bevy_image", "bevy_shader", "bevy_log", "bevy_color", "bevy_material", "morph", "morph_animation", "gltf_animation", "multi_threaded", "bevy_gizmos"] }
ahash = { version = ">=0.8.12", features = ["serde"] }
serde = { version = ">=1.0.228", features = ["derive"] }
walkdir = ">=2.5.0"
serde_json = ">=1.0.150"
bytemuck = ">=1.25.0"
gltf = ">=1.4.1"
bevy_obj = "0.19.0"
crossbeam-channel = ">=0.5.15"
toml = ">=1.1.2"
thiserror = ">=2.0.18"

[lints.clippy]
all = "deny"
missing_const_for_fn = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"
too_many_arguments = {level = "allow", priority = 16 }
type_complexity = {level = "allow", priority = 10 }

[lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
non_local_definitions = "deny"


[lib]
test = false
doctest = false

[features]
default = []
debug = ["bevy/debug"]
avian = []
jolt = []
boxddd = []

